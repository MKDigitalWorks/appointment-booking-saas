name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ chore/**, feat/**, fix/** ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CI: true
      # Dummy-ENVs, damit die Pipeline nicht wegen Secrets scheitert
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      STRIPE_SECRET_KEY: "sk_test_dummy"
      PRICE_ID: "price_dummy"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "dummysecret_dummysecret_dummysecret_123456"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ]; then
            npm run lint --if-present
          else
            echo "No ESLint config found. Skipping lint."
          fi

      - name: Typecheck
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc -v
            npx tsc --noEmit
          else
            echo "No tsconfig.json found. Skipping typecheck."
          fi

      - name: Install Playwright (browsers)
        run: |
          npx playwright --version || true
          npx playwright install --with-deps

      - name: E2E Smoke Tests
        run: |
          if [ -f "playwright.config.ts" ]; then
            npx playwright test --reporter=line || (echo "Playwright tests failed"; exit 1)
          else
            echo "No Playwright config found. Skipping tests."
          fi

      - name: Build
        run: npm run build
